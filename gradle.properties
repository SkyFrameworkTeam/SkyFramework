# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
# -SNAPSHOT marks an in-development build; only `./gradlew release` (see build.gradle) strips it
# and bumps the patch number for an actual release. Normal `./gradlew build` never touches this.
mod_version=1.0.2-BETA
maven_group=com.skyframework.islandcore

# Dependencies
fabric_api_version=0.116.14+1.21.1
